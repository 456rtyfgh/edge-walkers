<style>

<style>
/* ---- ui.css ---- */

.ew-gear {
  position: absolute; right: calc(env(safe-area-inset-right, 0px) + 6px); bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);

.ew-panel {

.ew-btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }

.ew-previewbox { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 12px; }

.ew-strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; min-height: 60px; align-items: center; }

.ew-x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: #ff5a64; color: #fff; font-size: 14px; line-height: 22px; padding: 0; cursor: pointer; }

.ew-toast {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%);
  max-width: 88%; padding: 10px 16px; border-radius: 12px; background: rgba(0, 0, 0, 0.82); color: #fff; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 4;
}
.ew-toast.show { opacity: 1; }

/* ── 공유 링크 ── */

/* ── 홈 화면 추가 안내 (document.body 직속) ── */
.ew-a2hs {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: rgba(8, 10, 18, 0.62); color: #eef0f8;

}
.ew-a2hs *, .ew-a2hs *::before { box-sizing: border-box; }
.ew-a2hs-box { width: 100%; max-width: 420px; padding: 20px 18px 16px; border-radius: 20px; background: rgba(28, 32, 48, 0.98); border: 1px solid rgba(255, 255, 255, 0.14); }
.ew-a2hs-title { margin: 0 0 10px; font-size: 18px; }

.ew-a2hs-steps li { margin: 6px 0; }
.ew-a2hs-ico { vertical-align: -5px; color: #9fb0ff; }

.ew-a2hs .ew-btn { min-height: 44px; padding: 0 16px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px; background: rgba(255, 255, 255, 0.08); color: inherit; font: inherit; }
.ew-a2hs .ew-btn.primary { background: #6f7dff; border-color: #6f7dff; color: #fff; font-weight: 600; }

</style>

<body>
<canvas id="ew-canvas"></canvas>
<div id="ew-probe"></div>
<div id="ew-ui-root"></div>
<script>
/* ---- config.js ---- */
// config.js — 외부 서비스 상수와 팩 한도 (공개용 키라 코드에 포함해도 됨)
(function () {
  const EW = (window.EW = window.EW || {});
  const SUPABASE_URL = 'https://vrszlmkrfsqctqxzcsjh.supabase.co';
  const BUCKET = 'edge-walkers-packs';
  const q = new URLSearchParams(location.search);
  // 테스트용: ?shareBase=http://127.0.0.1:5173/ 로 링크 기준 주소를 덮어쓴다
  const shareBase = q.get('shareBase') || 'https://456rtyfgh.github.io/edge-walkers/';

  EW.config = {
    SUPABASE_URL,
    SUPABASE_KEY: 'sb_publishable_fykX8dyjJEtzBkelZHyRYA_UsYBtOdm',
    BUCKET,
    PACK_ID_RE: /^[A-Za-z0-9_-]{8,32}$/,
    SHARE_BASE: shareBase,
    LIMITS: {
      maxBytes: 8 * 1024 * 1024, maxChars: 20, maxFramesPerAction: 8,
      minDim: 16, maxDim: 1024, maxFrameBytes: 1.5 * 1024 * 1024, maxNameLen: 40,
    },
    CLAMP: { scale: [0.3, 3], speed: [10, 300], fps: [1, 30], count: [1, 6] },
    packUrl: (id) => SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/packs/' + id + '.json',
    uploadUrl: (id) => SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/packs/' + id + '.json',
  };
})();

/* ---- toast.js ---- */
// toast.js — 최상위 토스트. 받은 문자열은 textContent 로만 넣는다.
(function () {
  const EW = (window.EW = window.EW || {});
  let el = null, timer = 0;

  function ensure() {
    if (el) return el;
    const st = document.createElement('style');
    st.textContent =
      '#ew-toast2{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-12px);' +
      'max-width:min(86vw,420px);padding:10px 16px;border-radius:14px;background:rgba(20,22,32,.92);color:#fff;' +
      'font:600 14px/1.4 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;text-align:center;z-index:2147483000;' +
      'opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.35)}' +
      '#ew-toast2.show{opacity:1;transform:translate(-50%,0)}' +
      '#ew-toast2.ok{background:rgba(32,110,70,.95)}#ew-toast2.error{background:rgba(150,45,45,.95)}';
    document.head.appendChild(st);
    el = document.createElement('div');
    el.id = 'ew-toast2';
    el.setAttribute('role', 'status');
    el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
    return el;
  }

  EW.toast = function (msg, kind, ms) {
    const t = ensure();
    t.textContent = String(msg == null ? '' : msg);
    t.className = (kind === 'ok' || kind === 'error' ? kind + ' ' : '') + 'show';
    clearTimeout(timer);
    timer = setTimeout(() => { t.classList.remove('show'); }, ms || 3500);
  };
})();

/* ---- store.js ---- */
// store.js — IndexedDB 저장소, 설정 기본값, CharacterDef 검증/변환
(function () {
  const EW = (window.EW = window.EW || {});
  const DB_NAME = 'edge-walkers';
  const ACTIONS = ['walk', 'idle', 'look', 'sit', 'jump', 'sleep'];
  const MIN = { walk: 2, idle: 1 };
  let dbp = null;

  function defaultSettings() {
    return {
      enabledIds: null,
      bg: { type: 'gradient', color: '#1b1f2a', color2: '#2c3350', image: null, fit: 'cover' },
      showSafeArea: false,
      overrides: {},
      importedPacks: [],
    };
  }

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('IndexedDB 미지원'));
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('characters')) db.createObjectStore('characters', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    dbp.catch(() => { dbp = null; });
    return dbp;
  }

  async function tx(storeName, mode, fn) {
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(storeName, mode);
      let out;
      const r = fn(t.objectStore(storeName));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => resolve(out);
      t.onerror = t.onabort = () => reject(t.error);
    });
  }

  async function decodeBlob(blob) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(blob); } catch (e) { /* Image 로 대체 */ }
    }
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('이미지 디코드 실패'));
      im.src = URL.createObjectURL(blob);
    });
  }

  const store = {
    ACTIONS,
    defaultSettings,
    decodeBlob,
    async open() { await open(); },
    listUserChars() { return tx('characters', 'readonly', (s) => s.getAll()).then((r) => r || []); },
    saveUserChar(c) { return tx('characters', 'readwrite', (s) => s.put(c)).then(() => {}); },
    deleteUserChar(id) { return tx('characters', 'readwrite', (s) => s.delete(id)).then(() => {}); },
    async getSettings() {
      const saved = await tx('settings', 'readonly', (s) => s.get('main'));
      const d = defaultSettings();
      if (!saved) return d;
      return Object.assign(d, saved, { bg: Object.assign(d.bg, saved.bg || {}), overrides: saved.overrides || {}, importedPacks: Array.isArray(saved.importedPacks) ? saved.importedPacks : [] });
    },
    async setSettings(partial) {
      const cur = await store.getSettings();
      const next = Object.assign({}, cur, partial);
      if (partial.bg) next.bg = Object.assign({}, cur.bg, partial.bg);
      await tx('settings', 'readwrite', (s) => s.put(next, 'main'));
      return next;
    },
    validateDef(def) {
      const errors = [], warnings = [];
      if (!def || typeof def !== 'object') return { ok: false, errors: ['정의가 없음'], warnings };
      const fr = def.frames || {};
      let w = null, h = null;
      for (const a of Object.keys(fr)) {
        if (!ACTIONS.includes(a)) { warnings.push(`알 수 없는 액션 '${a}' 무시`); continue; }
        if (!Array.isArray(fr[a]) || fr[a].length === 0) { errors.push(`${a}: 비어있지 않은 배열이어야 함`); continue; }
        for (const img of fr[a]) {
          const iw = img.width || img.naturalWidth, ih = img.height || img.naturalHeight;
          if (w == null) { w = iw; h = ih; }
          else if (iw !== w || ih !== h) { errors.push(`${a}: 프레임 크기 불일치 (${iw}x${ih} ≠ ${w}x${h})`); break; }
        }
      }
      for (const a of Object.keys(MIN)) {
        const n = (fr[a] || []).length;
        if (n < MIN[a]) errors.push(`${a}: 최소 ${MIN[a]}장 필요 (현재 ${n})`);
      }
      if (w != null && w !== h) warnings.push(`정사각형이 아님 (${w}x${h}) — 256x256 권장`);
      if (w != null && (w < 64 || w > 1024)) warnings.push('권장 크기 범위(64~1024px) 밖');
      return { ok: errors.length === 0, errors, warnings };
    },
    async storedToDef(sc) {
      const frames = {};
      for (const a of ACTIONS) {
        const blobs = sc.actions && sc.actions[a];
        if (!blobs || !blobs.length) continue;
        frames[a] = await Promise.all(blobs.map(decodeBlob));
      }
      const first = Object.values(frames)[0];
      return {
        id: sc.id, name: sc.name || sc.id, source: 'user',
        scale: sc.scale ?? 1, speed: sc.speed ?? 60, fps: sc.fps ?? 8, count: sc.count ?? 1,
        size: first && first[0] ? { w: first[0].width, h: first[0].height } : { w: 0, h: 0 },
        frames,
      };
    },
    applyOverrides(defs, settings) {
      const ids = settings && settings.enabledIds;
      const ov = (settings && settings.overrides) || {};
      return defs
        .filter((d) => !ids || ids.includes(d.id))
        .map((d) => Object.assign({}, d, ov[d.id] || {}));
    },
  };

  EW.store = store;
})();

/* ---- loader.js ---- */
// loader.js — 폴더 방식: sprites/manifest.json 기반 캐릭터 로드
(function () {
  const EW = (window.EW = window.EW || {});
  const num = (v, d) => (typeof v === 'number' && isFinite(v) && v > 0 ? v : d);
  const withSlash = (u) => (u.endsWith('/') ? u : u + '/');

  function loadImage(url) {
    return fetch(url).then((r) => {
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.blob();
    }).then((b) => EW.store.decodeBlob(b));
  }

  async function parseFolderEntry(entry, baseUrl) {
    baseUrl = withSlash(baseUrl || 'sprites/');
    const cfg = entry.config || {};
    const frames = {};
    for (const a of EW.store.ACTIONS) {
      const files = entry.files && entry.files[a];
      if (!files || !files.length) continue;
      frames[a] = await Promise.all(files.map((f) => loadImage(baseUrl + encodeURIComponent(entry.dir) + '/' + encodeURIComponent(f))));
    }
    const first = Object.values(frames)[0];
    return {
      id: entry.dir,
      name: cfg.name || entry.dir,
      source: 'folder',
      scale: num(cfg.scale, 1), speed: num(cfg.speed, 60), fps: num(cfg.fps, 8),
      count: Math.max(1, Math.round(num(cfg.count, 1))),
      size: first && first[0] ? { w: first[0].width, h: first[0].height } : { w: 0, h: 0 },
      frames,
    };
  }

  async function loadFolderChars(baseUrl) {
    baseUrl = withSlash(baseUrl || 'sprites/');
    let manifest;
    try {
      const r = await fetch(baseUrl + 'manifest.json', { cache: 'no-cache' });
      if (!r.ok) return [];
      manifest = await r.json();
    } catch (e) { return []; }
    const out = [];
    for (const entry of (manifest && manifest.characters) || []) {
      if (!entry.dir || entry.dir.startsWith('_')) continue;
      try {
        const def = await parseFolderEntry(entry, baseUrl);
        const v = EW.store.validateDef(def);
        if (v.ok) out.push(def);
        else console.warn('[edge-walkers] 폴더 캐릭터 제외:', entry.dir, v.errors.join(', '));
      } catch (e) { console.warn('[edge-walkers] 폴더 캐릭터 로드 실패:', entry.dir, e.message); }
    }
    return out;
  }

  EW.loader = { loadFolderChars, parseFolderEntry };
})();

/* ---- io.js ---- */
// io.js — base64 JSON 내보내기/가져오기
(function () {
  const EW = (window.EW = window.EW || {});

  const blobToDataUrl = (b) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(b);
  });
  const dataUrlToBlob = (u) => {
    const m = /^data:([^;,]+)?(;base64)?,([\s\S]*)$/.exec(u);
    if (!m) throw new Error('잘못된 data URL');
    const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: m[1] || 'image/png' });
  };
  const newId = () => 'u_' + Math.random().toString(36).slice(2, 10);

  async function exportChars(ids) {
    const all = await EW.store.listUserChars();
    const chars = [];
    for (const c of all) {
      if (ids && !ids.includes(c.id)) continue;
      const actions = {};
      for (const a of Object.keys(c.actions || {}))
        actions[a] = await Promise.all(c.actions[a].map(blobToDataUrl));
      chars.push({ id: c.id, name: c.name, scale: c.scale, speed: c.speed, fps: c.fps, count: c.count, actions });
    }
    return new Blob([JSON.stringify({ version: 1, characters: chars })], { type: 'application/json' });
  }

  async function importChars(fileOrText) {
    const added = [], errors = [];
    let data;
    try {
      const text = typeof fileOrText === 'string' ? fileOrText : await fileOrText.text();
      data = JSON.parse(text);
    } catch (e) { return { added, errors: ['JSON 파싱 실패: ' + e.message] }; }
    if (!data || data.version !== 1 || !Array.isArray(data.characters))
      return { added, errors: ['지원하지 않는 형식 (version 1 필요)'] };
    const existing = new Set((await EW.store.listUserChars()).map((c) => c.id));
    for (const c of data.characters) {
      try {
        const actions = {};
        for (const a of EW.store.ACTIONS) {
          const arr = c.actions && c.actions[a];
          if (Array.isArray(arr) && arr.length) actions[a] = arr.map(dataUrlToBlob);
        }
        let id = typeof c.id === 'string' && c.id.startsWith('u_') ? c.id : newId();
        while (existing.has(id)) id = newId();
        const sc = { id, name: c.name || id, scale: c.scale ?? 1, speed: c.speed ?? 60, fps: c.fps ?? 8, count: c.count ?? 1, actions };
        const v = EW.store.validateDef(await EW.store.storedToDef(sc));
        if (!v.ok) { errors.push(`${sc.name}: ${v.errors.join(', ')}`); continue; }
        await EW.store.saveUserChar(sc);
        existing.add(id);
        added.push(id);
      } catch (e) { errors.push(`${c && c.name}: ${e.message}`); }
    }
    return { added, errors };
  }

  EW.io = { exportChars, importChars, blobToDataUrl, dataUrlToBlob };
})();

/* ---- pack.js ---- */
// pack.js — 공유 팩 받기: fetch → 검증(절대 신뢰하지 않음) → IndexedDB 가져오기 (+ 링크 붙여넣기 폴백 UI)
(function () {
  const EW = (window.EW = window.EW || {});
  const C = () => EW.config;
  const ACTIONS = ['walk', 'idle', 'look', 'sit', 'jump', 'sleep'];
  const MSG = {
    'bad-id': '링크가 올바르지 않아요. 친구에게 링크를 다시 받아 보세요.',
    offline: '인터넷에 연결되어 있지 않아요. 연결되면 링크를 다시 열어 캐릭터를 받아 보세요.',
    'not-found': '캐릭터 팩을 찾을 수 없어요. 링크가 잘못되었거나 만료되었을 수 있어요.',
    'too-large': '캐릭터 팩이 너무 커서 받을 수 없어요.',
    'bad-json': '캐릭터 팩이 손상되었어요. 친구에게 다시 보내 달라고 해 보세요.',
    invalid: '캐릭터 팩이 올바르지 않아서 받을 수 없어요.',
    network: '캐릭터를 받아오지 못했어요. 잠시 후 다시 시도해 주세요.',
    storage: '이 기기에 저장하지 못했어요. 저장 공간을 확인해 주세요.',
  };
  const friendlyError = (code) => MSG[code] || MSG.network;
  const mkErr = (code, msg) => Object.assign(new Error(msg || MSG[code] || code), { code });

  function clamp(v, range, def, int) {
    let n = Number(v);
    if (!Number.isFinite(n)) n = def;
    n = Math.min(range[1], Math.max(range[0], n));
    return int ? Math.round(n) : n;
  }
  const CTRL_RE = new RegExp('[\\u0000-\\u001f\\u007f-\\u009f\\u200b-\\u200f\\u2028-\\u202e\\u2066-\\u2069\\ufeff]', 'g');
  function cleanName(s) {
    const L = C().LIMITS.maxNameLen;
    let t = typeof s === 'string' ? s : '';
    t = t.replace(CTRL_RE, '').trim();
    return Array.from(t).slice(0, L).join('') || '친구의 캐릭터';
  }
  const colorOr = (v, d) => (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v) ? v : d);

  // data:image/(png|webp);base64,... → {blob, bytes} 또는 throw
  function decodeDataUrl(u, maxBytes) {
    if (typeof u !== 'string') throw new Error('이미지가 문자열이 아니에요');
    const m = /^data:image\/(png|webp);base64,/.exec(u.slice(0, 40));
    if (!m) throw new Error('PNG/WebP 이미지만 받을 수 있어요');
    const b64 = u.slice(m[0].length);
    if ((b64.length * 3) / 4 > maxBytes + 3) throw new Error('이미지 한 장이 너무 커요');
    let bin;
    try { bin = atob(b64); } catch (e) { throw new Error('이미지 인코딩이 올바르지 않아요'); }
    if (bin.length > maxBytes) throw new Error('이미지 한 장이 너무 커요');
    const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    const png = a.length > 8 && a[0] === 0x89 && a[1] === 0x50 && a[2] === 0x4e && a[3] === 0x47;
    const webp = a.length > 12 && a[0] === 0x52 && a[1] === 0x49 && a[2] === 0x46 && a[3] === 0x46 && a[8] === 0x57 && a[9] === 0x45 && a[10] === 0x42 && a[11] === 0x50;
    if (m[1] === 'png' ? !png : !webp) throw new Error('이미지 내용이 선언된 형식과 달라요');
    return { blob: new Blob([a], { type: 'image/' + m[1] }), bytes: a.length };
  }
  async function dims(blob) {
    const bmp = await createImageBitmap(blob); // 디코드 실패 시 throw
    const d = { w: bmp.width, h: bmp.height };
    if (bmp.close) bmp.close();
    return d;
  }

  async function validatePack(obj, expectedId) {
    const L = C().LIMITS, K = C().CLAMP, errors = [];
    const bad = (m) => { errors.push(m); return { ok: false, errors, pack: null }; };
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return bad('팩 형식이 아니에요');
    if (obj.version !== 1) return bad('지원하지 않는 팩 버전이에요');
    if (typeof obj.packId !== 'string' || !C().PACK_ID_RE.test(obj.packId)) return bad('packId 가 올바르지 않아요');
    if (expectedId != null && obj.packId !== expectedId) return bad('packId 가 링크와 달라요');
    if (!Array.isArray(obj.characters) || obj.characters.length < 1) return bad('캐릭터가 없어요');
    if (obj.characters.length > L.maxChars) return bad('캐릭터가 너무 많아요 (최대 ' + L.maxChars + '개)');

    const chars = [];
    for (let ci = 0; ci < obj.characters.length; ci++) {
      const c = obj.characters[ci];
      const label = '캐릭터 ' + (ci + 1);
      if (!c || typeof c !== 'object' || !c.actions || typeof c.actions !== 'object') return bad(label + ': 형식이 올바르지 않아요');
      const actions = {};
      let size = null;
      for (const a of ACTIONS) {
        const arr = c.actions[a];
        if (arr == null) continue;
        if (!Array.isArray(arr) || arr.length < 1 || arr.length > L.maxFramesPerAction) return bad(label + ': ' + a + ' 프레임 수가 올바르지 않아요 (1~' + L.maxFramesPerAction + ')');
        const blobs = [];
        for (const u of arr) {
          let r;
          try { r = decodeDataUrl(u, L.maxFrameBytes); } catch (e) { return bad(label + ': ' + a + ' — ' + e.message); }
          let d;
          try { d = await dims(r.blob); } catch (e) { return bad(label + ': ' + a + ' — 이미지를 읽을 수 없어요'); }
          if (d.w < L.minDim || d.h < L.minDim || d.w > L.maxDim || d.h > L.maxDim) return bad(label + ': 프레임 크기가 허용 범위(' + L.minDim + '~' + L.maxDim + 'px)를 벗어나요');
          if (!size) size = d;
          else if (d.w !== size.w || d.h !== size.h) return bad(label + ': 프레임 크기가 서로 달라요');
          blobs.push(r.blob);
        }
        actions[a] = blobs;
      }
      if (!actions.walk || actions.walk.length < 2) return bad(label + ': walk 프레임이 최소 2장 필요해요');
      if (!actions.idle || actions.idle.length < 1) return bad(label + ': idle 프레임이 최소 1장 필요해요');
      chars.push({
        name: cleanName(c.name),
        scale: clamp(c.scale, K.scale, 1),
        speed: clamp(c.speed, K.speed, 60),
        fps: clamp(c.fps, K.fps, 8, true),
        count: clamp(c.count, K.count, 1, true),
        actions,
      });
    }

    let bg = null;
    if (obj.bg != null) {
      const b = obj.bg;
      if (typeof b !== 'object' || Array.isArray(b)) return bad('배경 형식이 올바르지 않아요');
      const type = ['color', 'gradient', 'image'].includes(b.type) ? b.type : 'gradient';
      let image = null;
      if (b.image != null) {
        try {
          const r = decodeDataUrl(b.image, L.maxBytes);
          const d = await dims(r.blob);
          if (d.w > 4096 || d.h > 4096 || d.w < 1 || d.h < 1) throw new Error('배경 이미지 크기가 허용 범위를 벗어나요');
          image = r.blob;
        } catch (e) { return bad('배경: ' + e.message); }
      }
      bg = {
        type: type === 'image' && !image ? 'gradient' : type,
        color: colorOr(b.color, '#1b1f2a'),
        color2: colorOr(b.color2, '#2c3350'),
        fit: 'cover',
        image,
      };
    }
    return { ok: true, errors, pack: { packId: obj.packId, characters: chars, bg } };
  }

  async function fetchPack(id) {
    if (typeof id !== 'string' || !C().PACK_ID_RE.test(id)) throw mkErr('bad-id');
    if (navigator.onLine === false) throw mkErr('offline');
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 20000);
    let res;
    try {
      res = await fetch(C().packUrl(id), { signal: ctl.signal });
    } catch (e) {
      clearTimeout(timer);
      throw mkErr(navigator.onLine === false ? 'offline' : 'network');
    }
    try {
      if (res.status === 404 || res.status === 400 || res.status === 403) throw mkErr('not-found');
      if (!res.ok) throw mkErr('network');
      const len = Number(res.headers.get('content-length'));
      if (len && len > C().LIMITS.maxBytes) throw mkErr('too-large');
      const text = await res.text();
      if (text.length > C().LIMITS.maxBytes) throw mkErr('too-large');
      try { return JSON.parse(text); } catch (e) { throw mkErr('bad-json'); }
    } catch (e) {
      if (e && e.code) throw e;
      throw mkErr(navigator.onLine === false ? 'offline' : 'network');
    } finally { clearTimeout(timer); }
  }

  const inflight = new Map();
  const newId = () => 'u_' + Math.random().toString(36).slice(2, 10);

  function importPack(obj, opts) {
    const onlyOnce = !opts || opts.onlyOnce !== false;
    const key = obj && typeof obj.packId === 'string' ? obj.packId : null;
    if (key && inflight.has(key)) return inflight.get(key);
    const p = doImport(obj, onlyOnce);
    if (key) { inflight.set(key, p); p.finally(() => inflight.delete(key)); }
    return p;
  }

  async function doImport(obj, onlyOnce) {
    const fail = (errors) => ({ status: 'invalid', added: [], bgApplied: false, errors });
    let v;
    try { v = await validatePack(obj, null); } catch (e) { return fail(['검증 중 오류: ' + e.message]); }
    if (!v.ok) return fail(v.errors);
    const pack = v.pack;
    let settings;
    try { await EW.store.open(); settings = await EW.store.getSettings(); } catch (e) { return fail(['storage']); }
    const imported = Array.isArray(settings.importedPacks) ? settings.importedPacks : [];
    if (onlyOnce && imported.includes(pack.packId)) return { status: 'duplicate', added: [], bgApplied: false, errors: [] };

    const existing = new Set((await EW.store.listUserChars()).map((c) => c.id));
    const saved = [];
    try {
      for (const c of pack.characters) {
        let id = newId();
        while (existing.has(id)) id = newId();
        existing.add(id);
        const sc = { id, name: c.name, scale: c.scale, speed: c.speed, fps: c.fps, count: c.count, actions: c.actions };
        const def = await EW.store.storedToDef(sc);
        const chk = EW.store.validateDef(def);
        if (!chk.ok) throw new Error(c.name + ': ' + chk.errors.join(', '));
        await EW.store.saveUserChar(sc);
        saved.push(id);
      }
      const patch = { importedPacks: onlyOnce ? imported.concat(pack.packId) : imported };
      if (Array.isArray(settings.enabledIds)) patch.enabledIds = settings.enabledIds.concat(saved);
      if (pack.bg) patch.bg = pack.bg;
      await EW.store.setSettings(patch);
      return { status: 'added', added: saved, bgApplied: !!pack.bg, errors: [] };
    } catch (e) {
      for (const id of saved) { try { await EW.store.deleteUserChar(id); } catch (_) { /* 롤백 최선 */ } }
      return fail([e && e.message ? e.message : 'storage']);
    }
  }

  // 주소/문장에서 팩 id 뽑기: 전체 URL(?pack=…) 또는 id 만
  function parseId(text) {
    const t = String(text || '').trim();
    if (!t) return null;
    try {
      const u = new URL(t);
      const id = u.searchParams.get('pack');
      return id && C().PACK_ID_RE.test(id) ? id : null;
    } catch (e) { /* URL 아님 */ }
    const m = /[?&]pack=([A-Za-z0-9_-]+)/.exec(t);
    if (m && C().PACK_ID_RE.test(m[1])) return m[1];
    return C().PACK_ID_RE.test(t) ? t : null;
  }

  async function importById(id) {
    try {
      if (typeof id !== 'string' || !C().PACK_ID_RE.test(id)) throw mkErr('bad-id');
      await EW.store.open();
      const st = await EW.store.getSettings();
      if ((st.importedPacks || []).includes(id)) return { status: 'duplicate', count: 0 };
      const obj = await fetchPack(id);
      if (obj && typeof obj === 'object' && obj.packId !== id) throw mkErr('invalid');
      const r = await importPack(obj);
      if (r.status === 'invalid') {
        console.warn('[edge-walkers] 팩 거부:', r.errors.join(' / '));
        return { status: 'error', code: r.errors[0] === 'storage' ? 'storage' : 'invalid' };
      }
      try { localStorage.setItem('ew.lastPack', id); } catch (e) { /* 무시 */ }
      return { status: r.status, count: r.added.length };
    } catch (e) {
      return { status: 'error', code: (e && e.code) || 'network' };
    }
  }

  function importFromLocation() {
    const id = new URLSearchParams(location.search).get('pack');
    if (id == null) return Promise.resolve({ status: 'none' });
    return importById(id);
  }

  // 홈 화면 앱(저장소가 비어 있음)용 최후 폴백: 링크 붙여넣기
  function showPasteDialog(onDone) {
    if (document.getElementById('ew-paste')) return;
    const css = document.createElement('style');
    css.textContent =
      '#ew-paste{position:fixed;inset:0;z-index:2147482000;background:rgba(10,12,20,.78);display:flex;align-items:center;justify-content:center;padding:24px;' +
      'font:15px/1.5 -apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;color:#fff}' +
      '#ew-paste .box{width:100%;max-width:360px;background:#262b3d;border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5)}' +
      '#ew-paste h2{margin:0 0 6px;font-size:18px}#ew-paste p{margin:0 0 12px;color:#c9cfe4;font-size:14px}' +
      '#ew-paste input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #4a526e;background:#171a26;color:#fff;font-size:16px;-webkit-user-select:text;user-select:text}' +
      '#ew-paste .msg{min-height:20px;margin:8px 0;color:#ff9b9b;font-size:13px}' +
      '#ew-paste .row{display:flex;gap:8px}#ew-paste button{flex:1;padding:12px;border-radius:10px;border:0;font-size:15px;font-weight:600;color:#fff;background:#4c6fff}' +
      '#ew-paste button.sub{background:#3a4058}';
    const wrap = document.createElement('div');
    wrap.id = 'ew-paste';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    const box = document.createElement('div'); box.className = 'box';
    const h = document.createElement('h2'); h.textContent = '친구가 보낸 링크가 있나요?';
    const p = document.createElement('p'); p.textContent = '홈 화면 앱은 Safari와 저장 공간이 따로예요. 받은 링크를 여기에 붙여넣으면 캐릭터를 가져와요.';
    const inp = document.createElement('input');
    inp.type = 'url'; inp.placeholder = 'https://…?pack=…'; inp.setAttribute('aria-label', '캐릭터 링크');
    inp.autocapitalize = 'off'; inp.autocomplete = 'off';
    const msg = document.createElement('div'); msg.className = 'msg'; msg.setAttribute('role', 'alert');
    const row = document.createElement('div'); row.className = 'row';
    const go = document.createElement('button'); go.type = 'button'; go.textContent = '가져오기';
    const skip = document.createElement('button'); skip.type = 'button'; skip.className = 'sub'; skip.textContent = '나중에';
    row.append(go, skip);
    box.append(h, p, inp, msg, row);
    wrap.append(css, box);
    document.body.appendChild(wrap);
    const close = () => wrap.remove();
    skip.addEventListener('click', () => { try { localStorage.setItem('ew.pasteSkipped', '1'); } catch (e) { /* 무시 */ } close(); });
    go.addEventListener('click', async () => {
      const id = parseId(inp.value);
      if (!id) { msg.textContent = '올바른 링크가 아니에요. 친구에게 받은 링크를 그대로 붙여넣어 주세요.'; return; }
      go.disabled = true; msg.style.color = '#c9cfe4'; msg.textContent = '받아오는 중…';
      const r = await importById(id);
      go.disabled = false;
      if (r.status === 'added' || r.status === 'duplicate') { close(); if (onDone) onDone(r); }
      else { msg.style.color = '#ff9b9b'; msg.textContent = friendlyError(r.code); }
    });
    setTimeout(() => inp.focus(), 50);
  }

  EW.packs = { validatePack, fetchPack, importPack, importFromLocation, importById, parseId, friendlyError, showPasteDialog };
})();

/* ---- share.js ---- */
// share.js — 내 캐릭터를 팩 JSON 으로 묶어 Supabase Storage 에 올리고 공유 링크를 만든다.
// 팩 형식은 PLAN.md P2-3, 상수는 EW.config (config.js, Dev-B).
(function () {
  const EW = (window.EW = window.EW || {});
  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_'; // 64자 → 바이트&63 이 균일
  const ID_LEN = 12;
  const UPLOAD_TIMEOUT_MS = 60000;
  const TOO_BIG = '용량이 너무 커요: 캐릭터를 줄이거나 배경을 빼 보세요';

  const cfg = () => EW.config;
  const fail = (msg, code) => Object.assign(new Error(msg), { code });

  function randomId(prefix) {
    const bytes = new Uint8Array(ID_LEN);
    crypto.getRandomValues(bytes);
    let s = '';
    for (const b of bytes) s += ALPHABET[b & 63];
    return (prefix || '') + s;
  }

  // 파일 앞부분으로 실제 형식 판별 (Blob.type 은 비어 있을 수 있음)
  async function sniff(blob) {
    const b = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
    if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'image/png';
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
    return null;
  }

  // PNG/WebP 면 그대로, 그 외(JPEG 등)는 canvas 로 PNG 재인코딩 → data URL
  async function toPackImage(blob) {
    let out = blob;
    let mime = await sniff(blob);
    if (!mime) {
      const bmp = await EW.store.decodeBlob(blob);
      const c = document.createElement('canvas');
      c.width = bmp.width || bmp.naturalWidth;
      c.height = bmp.height || bmp.naturalHeight;
      c.getContext('2d').drawImage(bmp, 0, 0);
      out = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('이미지 변환 실패'))), 'image/png'));
      mime = 'image/png';
    }
    const url = await EW.io.blobToDataUrl(out);
    // Blob.type 이 비면 FileReader 가 octet-stream 으로 만든다 → MIME 바로잡기
    return url.replace(/^data:[^;,]*/, 'data:' + mime);
  }

  async function buildPack(ids, includeBg, opts) {
    if (!cfg()) throw fail('공유 설정을 불러오지 못했어요', 'no-config');
    const L = cfg().LIMITS || {};
    const users = await EW.store.listUserChars();
    const picked = users.filter((c) => !ids || ids.includes(c.id));
    if (!picked.length) throw fail('공유할 내 캐릭터가 없어요', 'empty');
    if (L.maxChars && picked.length > L.maxChars) throw fail('한 번에 캐릭터 ' + L.maxChars + '개까지만 공유할 수 있어요', 'too-many');
    const characters = [];
    for (const c of picked) {
      const actions = {};
      for (const a of Object.keys(c.actions || {})) {
        const arr = c.actions[a];
        if (!arr || !arr.length) continue;
        if (L.maxFramesPerAction && arr.length > L.maxFramesPerAction)
          throw fail("'" + c.name + "'의 " + a + ' 프레임이 너무 많아요 (최대 ' + L.maxFramesPerAction + '장)', 'too-many-frames');
        actions[a] = await Promise.all(arr.map(toPackImage));
      }
      characters.push({ id: c.id, name: String(c.name || c.id).slice(0, L.maxNameLen || 40), scale: c.scale, speed: c.speed, fps: c.fps, count: c.count, actions });
    }
    let bg = null;
    if (includeBg) {
      const b = (await EW.store.getSettings()).bg || {};
      bg = { type: b.type, color: b.color, color2: b.color2, fit: b.fit || 'cover', image: null };
      if (b.type === 'image') {
        if (b.image) bg.image = await toPackImage(b.image);
        else bg.type = 'gradient';
      }
    }
    const id = randomId(opts && opts.idPrefix);
    const pack = { version: 1, packId: id, createdAt: new Date().toISOString(), characters, bg };
    const bytes = new Blob([JSON.stringify(pack)]).size;
    return { pack, id, bytes };
  }

  function httpMessage(status) {
    if (status === 401 || status === 403) return '업로드 권한이 없어요. 잠시 후 다시 시도해 주세요';
    if (status === 413) return TOO_BIG;
    if (status === 429) return '요청이 너무 많아요. 잠시 후 다시 시도해 주세요';
    if (status >= 500) return '서버가 잠시 불안정해요. 조금 뒤에 다시 시도해 주세요';
    return '올리지 못했어요 (오류 ' + status + ')';
  }
  const isDuplicate = (status, body) => status === 409 || (status === 400 && /duplicate|"409"|already exists/i.test(body || ''));

  async function uploadPack(pack, onProgress) {
    if (!cfg()) throw fail('공유 설정을 불러오지 못했어요', 'no-config');
    if (new Blob([JSON.stringify(pack)]).size > cfg().LIMITS.maxBytes) throw fail(TOO_BIG, 'too-large');
    if (navigator.onLine === false) throw fail('인터넷에 연결되어 있지 않아요', 'offline');
    const prefix = pack.packId.slice(0, Math.max(0, pack.packId.length - ID_LEN));
    for (let attempt = 0; attempt < 2; attempt++) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), UPLOAD_TIMEOUT_MS);
      let res;
      try {
        res = await fetch(cfg().uploadUrl(pack.packId), {
          method: 'POST',
          headers: { apikey: cfg().SUPABASE_KEY, Authorization: 'Bearer ' + cfg().SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify(pack),
          signal: ctl.signal,
        });
      } catch (e) {
        throw fail(e && e.name === 'AbortError' ? '업로드 시간이 너무 오래 걸려요. 네트워크를 확인해 주세요' : '인터넷 연결을 확인해 주세요', 'network');
      } finally { clearTimeout(timer); }
      if (res.ok) { if (onProgress) onProgress(1); return; }
      let errText = '';
      try { errText = await res.text(); } catch (e) { /* 무시 */ }
      if (attempt === 0 && isDuplicate(res.status, errText)) { pack.packId = randomId(prefix); continue; }
      throw fail(httpMessage(res.status), 'http-' + res.status);
    }
    throw fail('올리지 못했어요. 다시 시도해 주세요', 'duplicate');
  }

  async function createLink(o) {
    const opts = o || {};
    const say = (m) => { try { if (opts.onProgress) opts.onProgress(m); } catch (e) { /* 무시 */ } };
    say('팩 만드는 중…');
    const built = await buildPack(opts.ids == null ? null : opts.ids, !!opts.includeBg, { idPrefix: opts.idPrefix });
    const pack = built.pack;
    if (!cfg().PACK_ID_RE.test(pack.packId)) throw fail('링크 번호를 만들지 못했어요', 'bad-id');
    if (built.bytes > cfg().LIMITS.maxBytes) throw fail(TOO_BIG, 'too-large');
    if (EW.packs && EW.packs.validatePack) {
      const v = await EW.packs.validatePack(JSON.parse(JSON.stringify(pack)), pack.packId);
      if (!v.ok) throw fail('이 캐릭터는 공유 규격에 맞지 않아요: ' + (v.errors[0] || ''), 'invalid');
    }
    say('올리는 중…');
    await uploadPack(pack);
    say('완료!');
    return { id: pack.packId, url: cfg().SHARE_BASE + '?pack=' + pack.packId, bytes: built.bytes };
  }

  async function shareUrl(url, text) {
    if (navigator.share) {
      try {
        await navigator.share({ url, title: 'Edge Walkers', text: text || '내 캐릭터가 가장자리를 걸어요' });
        return 'shared';
      } catch (e) {
        if (e && e.name === 'AbortError') return 'cancelled';
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(url); return 'copied'; }
    } catch (e) { /* 수동 안내로 */ }
    return 'manual';
  }

  // idPrefix: 테스트가 'test' 로 바꿔 UI 흐름에서도 test 팩만 올리게 한다
  EW.share = { buildPack, uploadPack, createLink, shareUrl, idPrefix: '' };
})();

/* ---- demo-chars.js ---- */
// demo-chars.js — 오리지널 데모 캐릭터 2종(말랑 떡 슬라임, 꼬마 유령)을 Canvas 로 직접 그려 프레임 생성
// 규격: 256x256, 옆모습·오른쪽을 바라봄, 발(바닥)은 y=224, 가운데 x=128
(function () {
  const EW = (window.EW = window.EW || {});
  const S = 256, FOOT = 224, CX = 128;

  function make(draw) {
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    g.lineJoin = g.lineCap = 'round';
    draw(g);
    return c;
  }

  // 잠자는 표시 'z'
  function drawZ(g, x, y, s) {
    g.save();
    g.strokeStyle = '#ffffff'; g.lineWidth = 5; g.globalAlpha = 0.9;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + s, y); g.lineTo(x, y + s); g.lineTo(x + s, y + s); g.stroke();
    g.restore();
  }

  function eyes(g, ex, ey, o, gap, color) {
    g.fillStyle = g.strokeStyle = color;
    const ox = (o.look || 0) * 6, oy = o.lookUp ? -6 : 0;
    for (let i = 0; i < 2; i++) {
      const x = ex + i * gap + ox, y = ey + oy;
      if (o.eye === 'closed') {
        g.lineWidth = 4; g.beginPath(); g.arc(x, y, 7, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
      } else {
        const r = o.eye === 'wide' ? 10 : 8;
        g.beginPath(); g.ellipse(x, y, r - 1, r + 2, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#fff'; g.beginPath(); g.arc(x + 2 + (o.look || 0) * 1.5, y - 4, 2.6, 0, Math.PI * 2); g.fill();
        g.fillStyle = color;
      }
    }
  }

  // ───────── 말랑 떡 슬라임 ─────────
  function drawSlime(g, o) {
    const w = o.w || 150, h = o.h || 105, lift = o.lift || 0, dx = o.dx || 0, sk = o.skew || 0;
    const b = FOOT - lift, cx = CX + dx, top = b - h;
    // 바닥 그림자 (공중일 때 작아짐)
    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.beginPath(); g.ellipse(CX, FOOT, (w / 2) * (1 - lift / 160), 5, 0, 0, Math.PI * 2); g.fill();
    g.beginPath();
    g.moveTo(cx - w / 2, b);
    g.bezierCurveTo(cx - w / 2 - 8, b - h * 0.55, cx - w * 0.28 + sk, top, cx + sk, top);
    g.bezierCurveTo(cx + w * 0.28 + sk, top, cx + w / 2 + 8, b - h * 0.55, cx + w / 2, b);
    g.quadraticCurveTo(cx, b + 2, cx - w / 2, b);
    g.closePath();
    const gr = g.createLinearGradient(0, top, 0, b);
    gr.addColorStop(0, '#b4f0d4'); gr.addColorStop(1, '#63cfa4');
    g.fillStyle = gr; g.fill();
    g.lineWidth = 5; g.strokeStyle = '#2f9272'; g.stroke();
    // 윤기
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath(); g.ellipse(cx - w * 0.2 + sk, top + h * 0.28, w * 0.1, h * 0.09, -0.6, 0, Math.PI * 2); g.fill();
    // 머리 위 새싹
    const sx = cx + sk - 6;
    g.strokeStyle = '#2f9272'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(sx, top + 2); g.quadraticCurveTo(sx - 2, top - 14, sx + 8, top - 20); g.stroke();
    g.fillStyle = '#8be08a';
    g.beginPath(); g.ellipse(sx + 14, top - 20, 11, 6, -0.4, 0, Math.PI * 2); g.fill(); g.stroke();
    // 얼굴 (오른쪽으로 치우침)
    const ex = cx + w * 0.12 + sk * 0.5, ey = b - h * 0.52;
    eyes(g, ex, ey, o, 30, '#1f3b38');
    g.fillStyle = 'rgba(255,130,150,0.55)';
    g.beginPath(); g.ellipse(ex + 40, ey + 14, 8, 5, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#1f3b38'; g.lineWidth = 3.5;
    g.beginPath(); g.arc(ex + 15 + (o.look || 0) * 4, ey + 12, 6, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();
  }

  // ───────── 꼬마 유령 ─────────
  function drawGhost(g, o) {
    const w = o.w || 104, h = o.h || 124, lift = o.lift || 0, tilt = o.tilt || 0, wave = o.wave || 0;
    const b = FOOT - lift, top = b - h, r = w / 2;
    g.fillStyle = 'rgba(0,0,0,0.16)';
    g.beginPath(); g.ellipse(CX, FOOT, r * 0.8 * (1 - lift / 160), 5, 0, 0, Math.PI * 2); g.fill();
    g.save();
    g.translate(CX, b); g.rotate(tilt); g.translate(-CX, -b);
    // 팔
    const armUp = o.armUp ? 1 : 0;
    g.fillStyle = '#f1edff'; g.strokeStyle = '#7b6cc0'; g.lineWidth = 5;
    for (const side of [1, -1]) {
      if (side === -1 && !o.armUp) continue; // 옆모습: 평소엔 앞팔 하나만
      g.save();
      g.translate(CX + side * (r - 2) * (armUp ? 1 : 0.55), top + h * 0.52);
      g.rotate(side * (armUp ? -2.2 : 0.7));
      g.beginPath(); g.ellipse(0, 14, 9, 17, 0, 0, Math.PI * 2); g.fill(); g.stroke();
      g.restore();
    }
    // 몸통: 돔 + 물결 바닥(발 번갈아 닿음)
    g.beginPath();
    g.moveTo(CX - r, b - 14);
    g.arc(CX, top + r, r, Math.PI, 0);
    g.lineTo(CX + r, b - 14);
    const n = 3, seg = w / n;
    for (let k = 0; k < n; k++) {
      const xr = CX + r - k * seg, xl = xr - seg;
      const depth = (k % 2 === (wave ? 1 : 0)) ? 14 : 5; // 바닥(b)까지 내려오는 정도
      g.bezierCurveTo(xr - 3, b - 14 + depth, xl + 3, b - 14 + depth, xl, b - 14);
    }
    g.closePath();
    const gr = g.createLinearGradient(0, top, 0, b);
    gr.addColorStop(0, '#fbf9ff'); gr.addColorStop(1, '#d9d0f7');
    g.fillStyle = gr; g.fill(); g.stroke();
    // 얼굴
    const ex = CX + r * 0.1, ey = top + h * 0.38;
    eyes(g, ex, ey, o, 28, '#2b2450');
    g.fillStyle = 'rgba(255,140,170,0.55)';
    g.beginPath(); g.ellipse(ex + 38, ey + 16, 8, 5, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#2b2450'; g.lineWidth = 3.5;
    g.beginPath(); g.ellipse(ex + 14 + (o.look || 0) * 4, ey + 18, 5, o.open ? 6 : 3.5, 0, 0, Math.PI * 2);
    o.open ? g.fill() : g.stroke();
    g.restore();
  }

  function slimeFrames() {
    return {
      walk: [
        { w: 150, h: 105 },
        { w: 138, h: 118, skew: 10, dx: 3 },
        { w: 162, h: 94, dx: 2 },
        { w: 144, h: 112, skew: -5 },
      ].map((o) => make((g) => drawSlime(g, o))),
      idle: [{ w: 152, h: 104 }, { w: 146, h: 111 }].map((o) => make((g) => drawSlime(g, o))),
      look: [{ w: 144, h: 112, look: -1.5 }, { w: 144, h: 114, look: -1.5, lookUp: true, eye: 'wide' }]
        .map((o) => make((g) => drawSlime(g, o))),
      sit: [{ w: 170, h: 82 }].map((o) => make((g) => drawSlime(g, o))),
      jump: [
        { w: 172, h: 76 },
        { w: 124, h: 130, lift: 50, skew: 6, eye: 'wide' },
        { w: 164, h: 86 },
      ].map((o) => make((g) => drawSlime(g, o))),
      sleep: [
        { w: 168, h: 88, eye: 'closed' },
        { w: 172, h: 84, eye: 'closed' },
      ].map((o, i) => make((g) => { drawSlime(g, o); drawZ(g, 180 + i * 6, 96 - i * 14, 14 + i * 4); })),
    };
  }

  function ghostFrames() {
    return {
      walk: [
        { wave: 0, tilt: -0.05 }, { wave: 1, tilt: 0, h: 128 },
        { wave: 0, tilt: 0.05 }, { wave: 1, tilt: 0, h: 128 },
      ].map((o) => make((g) => drawGhost(g, o))),
      idle: [{ h: 124 }, { h: 130, armUp: true }].map((o) => make((g) => drawGhost(g, o))),
      look: [{ look: -1.5, tilt: -0.08 }, { look: -1.5, lookUp: true, tilt: -0.12, eye: 'wide' }]
        .map((o) => make((g) => drawGhost(g, o))),
      sit: [{ h: 92, w: 112 }].map((o) => make((g) => drawGhost(g, o))),
      jump: [
        { h: 96, w: 112 },
        { h: 134, lift: 52, armUp: true, open: true, eye: 'wide', wave: 1 },
        { h: 102, w: 110 },
      ].map((o) => make((g) => drawGhost(g, o))),
      sleep: [
        { h: 108, tilt: 0.12, eye: 'closed' },
        { h: 112, tilt: 0.16, eye: 'closed' },
      ].map((o, i) => make((g) => { drawGhost(g, o); drawZ(g, 178 + i * 6, 84 - i * 14, 14 + i * 4); })),
    };
  }

  const DEFS = [
    { id: 'slime', name: '말랑 떡 슬라임', speed: 58, fps: 8, scale: 1, count: 1, make: slimeFrames },
    { id: 'ghost', name: '꼬마 유령', speed: 50, fps: 6, scale: 1, count: 1, make: ghostFrames },
  ];

  EW.demo = {
    DEFS,
    async getDemoChars() {
      return DEFS.map((d) => ({
        id: d.id, name: d.name, source: 'builtin',
        scale: d.scale, speed: d.speed, fps: d.fps, count: d.count,
        size: { w: S, h: S }, frames: d.make(),
      }));
    },
  };
})();

/* ---- path.js ---- */
// 화면 둘레를 도는 둥근 사각형 경로. 발 접지점이 이 선 위를 따라간다.
// 진행 방향: 화면 기준 반시계 (바닥→오른쪽 벽(위로)→천장(왼쪽으로)→왼쪽 벽(아래로)).
// theta = 진행 방향 접선 각도(canvas rotate 에 그대로 사용) → 바닥 0, 오른쪽 벽 -90°, 천장 180°, 왼쪽 벽 90°.
// 모서리 호를 따라 theta 가 연속으로 변하므로 별도 보간 없이 부드럽게 회전한다.
(function () {
  const EW = (window.EW = window.EW || {});
  const PI = Math.PI;

  function make(o) {
    const W = o.W, H = o.H, ins = o.insets || { top: 0, right: 0, bottom: 0, left: 0 };
    const m = o.margin == null ? 3 : o.margin;
    const L = ins.left + m, R = W - ins.right - m, T = ins.top + m, B = H - ins.bottom - m;
    const w = Math.max(10, R - L), h = Math.max(10, B - T);
    const r = Math.max(1, Math.min(o.radius || 30, w / 2 - 1, h / 2 - 1));
    const segs = [];
    let acc = 0;
    function add(seg) { seg.s0 = acc; acc += seg.len; segs.push(seg); }
    const arcLen = (PI * r) / 2;
    add({ k: 'l', x: L + r, y: B, dx: 1, dy: 0, len: w - 2 * r, th: 0, e0: 'bottom', e1: 'bottom' });
    add({ k: 'a', cx: R - r, cy: B - r, a0: PI / 2, len: arcLen, e0: 'bottom', e1: 'right' });
    add({ k: 'l', x: R, y: B - r, dx: 0, dy: -1, len: h - 2 * r, th: -PI / 2, e0: 'right', e1: 'right' });
    add({ k: 'a', cx: R - r, cy: T + r, a0: 0, len: arcLen, e0: 'right', e1: 'top' });
    add({ k: 'l', x: R - r, y: T, dx: -1, dy: 0, len: w - 2 * r, th: PI, e0: 'top', e1: 'top' });
    add({ k: 'a', cx: L + r, cy: T + r, a0: -PI / 2, len: arcLen, e0: 'top', e1: 'left' });
    add({ k: 'l', x: L, y: T + r, dx: 0, dy: 1, len: h - 2 * r, th: PI / 2, e0: 'left', e1: 'left' });
    add({ k: 'a', cx: L + r, cy: B - r, a0: PI, len: arcLen, e0: 'left', e1: 'bottom' });
    const P = acc;

    function at(s) {
      s = ((s % P) + P) % P;
      let seg = segs[segs.length - 1];
      for (let i = 0; i < segs.length; i++) {
        if (s < segs[i].s0 + segs[i].len) { seg = segs[i]; break; }
      }
      const u = s - seg.s0;
      if (seg.k === 'l') {
        return { x: seg.x + seg.dx * u, y: seg.y + seg.dy * u, theta: seg.th, edge: seg.e0 };
      }
      const a = seg.a0 - u / r;
      return {
        x: seg.cx + r * Math.cos(a), y: seg.cy + r * Math.sin(a), theta: a - PI / 2,
        edge: u < seg.len / 2 ? seg.e0 : seg.e1,
      };
    }

    // 모서리 호 가운데 s (BR, TR, TL, BL 순) 와 변 가운데 s (bottom, right, top, left 순)
    const cornerS = [1, 3, 5, 7].map((i) => segs[i].s0 + segs[i].len / 2);
    const edgeMidS = [0, 2, 4, 6].map((i) => segs[i].s0 + segs[i].len / 2);
    return { P, r, rect: { L, R, T, B }, at, cornerS, edgeMidS };
  }

  EW.path = { make };
})();

/* ---- behavior.js ---- */
// 행동 상태머신(live) + 주기 스케줄(loop). 모든 난수는 시드 PRNG 로만 뽑는다.
(function () {
  const EW = (window.EW = window.EW || {});

  function rng(seed) {
    let a = (seed >>> 0) || 1; // mulberry32
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const range = (r, lo, hi) => lo + (hi - lo) * r();

  const PAUSE_DUR = { idle: [1.5, 3.5], look: [2, 3.5], sit: [3, 6], sleep: [5, 9] };
  const PAUSE_W = [['idle', 0.45], ['look', 0.2], ['sit', 0.2], ['sleep', 0.15]];
  const JUMP_DUR = 0.7;
  // 액션별 프레임 재생 속도 배율 (walk 는 def.fps 그대로)
  const RATE = { walk: 1, idle: 0.4, look: 0.25, sit: 0.3, sleep: 0.2, jump: 1 };
  // 선택 액션이 없을 때의 대체 순서
  const FALLBACK = { look: ['look', 'idle'], sit: ['sit', 'idle'], sleep: ['sleep', 'sit', 'idle'], jump: ['jump', 'idle'], idle: ['idle'], walk: ['walk'] };

  function has(def, a) { return !!(def.frames[a] && def.frames[a].length); }
  function framesFor(def, action) {
    const list = FALLBACK[action] || [action];
    for (const a of list) if (has(def, a)) return def.frames[a];
    return def.frames.idle;
  }
  function pickPause(def, r) {
    const opts = PAUSE_W.filter((p) => has(def, p[0]));
    let sum = 0;
    for (const p of opts) sum += p[1];
    let x = r() * sum;
    for (const p of opts) { x -= p[1]; if (x <= 0) return p[0]; }
    return 'idle';
  }

  // ---------- live ----------
  function startAction(w, a, r) {
    w.action = a; w.aT = 0;
    if (a === 'walk') w.walkLeft = range(r, 4, 12);
    else if (a === 'jump') w.dur = JUMP_DUR;
    else w.dur = range(r, PAUSE_DUR[a][0], PAUSE_DUR[a][1]);
  }

  // 진행 방향 앞쪽에서 막고 있는 개체. 마주 오는 개체이거나, 같은 방향이지만 멈췄거나 더 느린 개체.
  function blockerOf(w, all, P) {
    for (const o of all) {
      if (o === w) continue;
      let d = ((o.s - w.s) * w.dir) % P;
      if (d < 0) d += P;

        slider('프레임 fps', 'fps', 1, 24, 1, (v) => v + 'fps'),
        slider('마릿수', 'count', 1, 8, 1, (v) => v + '마리'),
        isUser ? h('p', { class: 'ew-sub', text: '투명 PNG(WebP 가능) · 모든 프레임 같은 크기(권장 256×256) · 오른쪽을 바라보고 발은 아래쪽 같은 높이에. 걷기 2장+멍때리기 1장만 있어도 됩니다.' }) : h('p', { class: 'ew-sub', text: '내장/폴더 캐릭터는 이미지를 바꿀 수 없고 크기·속도·fps·마릿수만 조절됩니다.' }),
        actionBlocks,
        msg,
        h('div', { class: 'ew-btnrow' }, saveBtn, resetBtn, delBtn)));
    revalidate();
    startPreview();
  }

  function drawStrip(a, strip) {
    strip.replaceChildren();
    const list = editor.actions[a] || [];
    if (!list.length) { strip.append(h('span', { class: 'ew-sub', text: '이미지 없음' })); return; }
    list.forEach((blob, i) => {
      strip.append(h('div', { class: 'ew-frame' },
        h('img', { src: urlOf(blob), alt: `${a} ${i + 1}` }),
        h('button', {
          type: 'button', class: 'ew-x', 'aria-label': `${a} ${i + 1}번 삭제`,
          onclick: () => { list.splice(i, 1); if (!list.length) delete editor.actions[a]; drawStrip(a, strip); revalidate(); },
        }, '×'),
        h('span', { class: 'ew-idx', text: i + 1 })));
    });
  }

  async function currentDef() {
    const ed = editor;
    if (ed.mode === 'override') return Object.assign({}, ed.base, { scale: ed.scale, speed: ed.speed, fps: ed.fps, count: ed.count });
    return EW.store.storedToDef({ id: ed.id, name: ed.name, scale: ed.scale, speed: ed.speed, fps: ed.fps, count: ed.count, actions: ed.actions });
  }

  let revalSeq = 0;
  async function revalidate() {
    const ed = editor; if (!ed) return;
    const seq = ++revalSeq;
    let v;
    try {
      ed.def = await currentDef();
      v = EW.store.validateDef(ed.def);
    } catch (e) { v = { ok: false, errors: ['이미지를 읽을 수 없습니다 (' + e.message + ')'], warnings: [] }; ed.def = null; }
    if (seq !== revalSeq || editor !== ed) return;
    ed.valid = v.ok;
    ed.saveBtn.disabled = !v.ok;
    ed.msg.replaceChildren(
      ...v.errors.map((t) => h('div', { class: 'ew-err', text: '⚠ ' + t })),
      ...v.warnings.map((t) => h('div', { class: 'ew-warn', text: 'ℹ ' + t })),
      v.ok && !v.warnings.length ? h('div', { class: 'ew-ok', text: '✓ 규격에 맞아요' }) : null);
  }

  async function save() {
    const ed = editor;
    if (!ed || !ed.valid) return;
    if (ed.mode === 'override') {
      const s = await EW.store.getSettings();
      const ov = Object.assign({}, s.overrides, { [ed.id]: { scale: ed.scale, speed: ed.speed, fps: ed.fps, count: ed.count } });
      await EW.store.setSettings({ overrides: ov });
    } else {
      const sc = { id: ed.id, name: ed.name.trim() || '이름 없음', scale: ed.scale, speed: ed.speed, fps: ed.fps, count: ed.count, actions: ed.actions };
      await EW.store.saveUserChar(sc);
      const s = await EW.store.getSettings();
      if (ed.isNew && s.enabledIds && !s.enabledIds.includes(ed.id)) await EW.store.setSettings({ enabledIds: [...s.enabledIds, ed.id] });
    }
    await changed();
    toast('저장했어요');
    showList();
  }

  // ───────── 미리보기 ─────────
  function startPreview() {
    stopPreview();
    const t0 = performance.now();
    const tick = (now) => {
      previewRAF = requestAnimationFrame(tick);
      const ed = editor; if (!ed || !ed.previewCanvas || !ed.def) return;
      const frames = ed.def.frames;
      let a = ed.previewAction, list = frames[a];
      let sub = '';
      if (!list || !list.length) {
        for (const alt of FALLBACK[a] || []) if (frames[alt] && frames[alt].length) { list = frames[alt]; sub = alt; break; }
      }
      const c = ed.previewCanvas, g = c.getContext('2d');
      g.clearRect(0, 0, c.width, c.height);
      g.strokeStyle = 'rgba(255,255,255,0.25)'; g.beginPath();
      const gy = c.height * (224 / 256); g.moveTo(0, gy); g.lineTo(c.width, gy); g.stroke();
      if (!list || !list.length) return;
      const fps = Math.max(1, ed.fps);
      const img = list[Math.floor(((now - t0) / 1000) * fps) % list.length];
      g.drawImage(img, 0, 0, c.width, c.height);
      if (sub) { g.fillStyle = 'rgba(255,255,255,0.7)'; g.font = '12px sans-serif'; g.fillText(`'${a}' 없음 → ${sub} 대체`, 8, 16); }
    };
    previewRAF = requestAnimationFrame(tick);
  }
  function stopPreview() { if (previewRAF) cancelAnimationFrame(previewRAF); previewRAF = 0; }

  EW.ui = { init, open, close, isOpen, refresh: () => panelOpen && showList() };
})();

/* ---- main.js ---- */
// 부팅·조립: 캐릭터 합치기(builtin < folder, + user), 설정 반영, 엔진 구동, 녹화 모드.
(function () {
  const EW = (window.EW = window.EW || {});
  const q = new URLSearchParams(location.search);
  const record = q.get('record') === '1';
  const hideUI = record || q.get('hideUI') === '1';
  const seed = Number(q.get('seed')) || 1;
  const loopDur = Number(q.get('loop')) || 0;
  const charFilter = q.get('chars') ? q.get('chars').split(',').map((s) => s.trim()).filter(Boolean) : null;
  const spritesBase = q.get('spritesBase') || 'sprites/';
  const REC = { w: 393, h: 852, dpr: 3, insets: { top: 59, right: 0, bottom: 34, left: 0 } };

  const canvas = document.getElementById('ew-canvas');
  const root = document.getElementById('ew-ui-root');
  const probe = document.getElementById('ew-probe');
  const engine = EW.engine.create(canvas, { seed, loop: loopDur ? { duration: loopDur } : null });

  let baseDefs = []; // 오버라이드 적용 전 전체 (builtin + folder + user)
  let settings = null;

  function measureInsets() {
    const cs = getComputedStyle(probe);
    return { top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0, bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0 };
  }
  function fit() {
    if (record) { engine.resize(REC.w, REC.h, REC.dpr); engine.setInsets(REC.insets); return; }
    engine.resize(window.innerWidth, window.innerHeight, Math.min(window.devicePixelRatio || 1, 3));
    engine.setInsets(measureInsets());
  }

  async function safe(fn, fallback) {
    try { return await fn(); } catch (e) { console.warn('[edge-walkers]', e && e.message); return fallback; }
  }

  async function gather() {
    const map = new Map();
    const demo = EW.demo ? await safe(() => EW.demo.getDemoChars(), []) : [];
    for (const d of demo) map.set(d.id, Object.assign({ source: 'builtin' }, d));
    const folder = EW.loader ? await safe(() => EW.loader.loadFolderChars(spritesBase), []) : [];
    for (const d of folder) map.set(d.id, Object.assign({}, d, { source: 'folder' })); // folder > builtin
    if (!record && EW.store) {
      const stored = await safe(() => EW.store.listUserChars(), []);
      for (const sc of stored) {
        const d = await safe(() => EW.store.storedToDef(sc), null);
        if (d) map.set(d.id, Object.assign({ source: 'user' }, d));
      }
    }
    return Array.from(map.values());
  }


  // ---- 홈 화면 앱(PWA) 지원 ------------------------------------------------
  // iOS 는 Safari 와 홈 화면 앱의 저장소가 분리돼 있어서, 시작 URL 에 ?pack 이 실려 있어야 한다.
  // 1) 현재 URL 을 start_url 로 하는 동적 매니페스트(Blob) 2) 주소의 ?pack 유지(지우지 않음) 3) SW 의 manifest.webmanifest?pack= 응답
  const isStandalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  function setupManifest() {
    if (record || !/^https?:$/.test(location.protocol)) return;
    const link = document.querySelector('link[rel="manifest"]');
    if (!link) return;
    const scope = new URL('./', location.href).href;
    const packId = q.get('pack');
    const startUrl = packId && EW.config && EW.config.PACK_ID_RE.test(packId) ? scope + '?pack=' + packId : scope;
    const abs = (f) => new URL(f, scope).href;
    const m = {
      name: 'Edge Walkers', short_name: 'Edge Walkers', description: '가장자리를 걷는 캐릭터 배경화면',
      id: scope, start_url: startUrl, scope, display: 'standalone', orientation: 'portrait',
      background_color: '#1b1f2a', theme_color: '#1b1f2a',
      icons: [
        { src: abs('icons/icon-192.png'), sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: abs('icons/icon-512.png'), sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: abs('icons/icon-maskable-512.png'), sizes: '512x512', type: 'image/png', purpose: 'maskable' },
      ],
    };
    try {
      link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    } catch (e) {
      if (packId) link.href = 'manifest.webmanifest?pack=' + encodeURIComponent(packId); // SW 가 start_url 을 바꿔 응답
    }
  }
  function registerSW() {
    if (record || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[edge-walkers] SW 등록 실패', e && e.message));
  }
  async function receivePack() {
    if (!EW.packs) return { status: 'none' };
    const r = await safe(() => EW.packs.importFromLocation(), { status: 'error', code: 'network' });
    if (r.status === 'added') {
      await reload();
      if (EW.ui && EW.ui.refresh) EW.ui.refresh();
      if (EW.toast) EW.toast('캐릭터 ' + r.count + '개 받았어요', 'ok');
    } else if (r.status === 'error') {
      if (EW.toast) EW.toast(EW.packs.friendlyError(r.code), 'error', 6000);
    }
    return r;
  }
  async function maybeAskForLink(r) {
    // 홈 화면 앱이 빈 저장소로 떴을 때만: 주소에 pack 없음 + 내 캐릭터·받은 팩 없음
    if (!EW.packs || !isStandalone() || q.get('pack') || r.status === 'added') return;
    try { if (localStorage.getItem('ew.pasteSkipped')) return; } catch (e) { /* 무시 */ }
    const st = await safe(() => EW.store.getSettings(), null);
    const users = await safe(() => EW.store.listUserChars(), []);
    if (st && (st.importedPacks || []).length) return;
    if (users.length) return;
    EW.packs.showPasteDialog(async () => { await reload(); if (EW.toast) EW.toast('캐릭터를 받았어요', 'ok'); });
  }

  async function reload() {
    if (!record && EW.store) settings = await safe(() => EW.store.getSettings(), null);
    baseDefs = await gather();
    let defs = baseDefs;
    if (record) {
      // 재현성: 사용자 설정·오버라이드 무시, ?chars 순서대로
      if (charFilter) defs = charFilter.map((id) => baseDefs.find((d) => d.id === id)).filter(Boolean);
    } else {
      if (EW.store && settings) defs = EW.store.applyOverrides(baseDefs, settings);
      if (charFilter) defs = defs.filter((d) => charFilter.includes(d.id));
    }
    engine.setCharacters(defs);
    if (settings && settings.bg) engine.setBackground(settings.bg);
  }

  setupManifest();

  const ready = (async function () {
    if (EW.store && !record) await safe(() => EW.store.open(), null);
    fit();
    await reload();
    if (!record) {
      new ResizeObserver(fit).observe(document.documentElement);
      window.addEventListener('orientationchange', () => setTimeout(fit, 200));
      engine.start();
    }
    return true;
  })();

  // 초기 화면을 먼저 띄운 뒤 ?pack 을 받는다 (네트워크가 느려도 앱은 바로 보임)
  const packReady = ready.then(async () => {
    if (record) return { status: 'none' };
    registerSW();
    const r = await receivePack();
    if (EW.a2hs && !hideUI) { try { EW.a2hs.init(); } catch (e) { console.warn('[edge-walkers] a2hs', e && e.message); } }
    await maybeAskForLink(r);
    return r;
  });

  window.__ew = { engine, ready, packReady, reload, getBaseDefs: () => baseDefs };

  if (hideUI) {
    root.style.display = 'none';
  } else {
    root.addEventListener('ew:tap', (e) => engine.tap(e.detail.x, e.detail.y));
    ready.then(() => {
      if (EW.ui) {
        EW.ui.init({ root, getEngine: () => engine, getAllDefs: () => baseDefs, onChange: reload });
      } else {
        // 설정 UI 가 없는 빌드에서도 탭 점프는 동작
        root.addEventListener('pointerup', (e) => engine.tap(e.clientX, e.clientY));
      }
    });
  }
})();

</script>
