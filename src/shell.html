<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Edge Walkers">
<meta name="theme-color" content="#1b1f2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Edge Walkers</title>
<style>
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #1b1f2a;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#ew-canvas {
  position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
  display: block;
}
#ew-ui-root {
  position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
  z-index: 10; touch-action: none;
}
#ew-probe {
  position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
</style>
<!--CSS-->
</head>
<body>
<canvas id="ew-canvas"></canvas>
<div id="ew-probe"></div>
<div id="ew-ui-root"></div>
<!--JS-->
</body>
</html>
